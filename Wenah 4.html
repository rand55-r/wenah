const LG=()=>{const r=st.reg;return `<div class=hero style="text-align:center;padding-top:20px"><div class=top style="justify-content:flex-end"><button class=lang onclick="setLang()">${t('lang')}</button></div><img src="${LOGO}" width=84 height=84 alt="" style="border-radius:22px;margin-top:8px"><h2 style="font-size:26px;margin:10px 0 2px;color:var(--brand)">${t('app')}</h2><p class=tag style="margin-bottom:0">${t('tag')}</p></div><div class=pad><h2 style="margin-top:6px">${t(r?'signup':'login')}</h2>${r?`<label for=a-n>${t('nm')}</label><input id=a-n autocomplete=name><div class=err id=e-a-n hidden>${t('req')}</div>`:''}<label for=a-e>${t('email')}</label><input id=a-e type=email autocomplete=email dir=ltr><div class=err id=e-a-e hidden>${t('bade')}</div><label for=a-p>${t('pass')}</label><input id=a-p type=password autocomplete=current-password dir=ltr><div class=err id=e-a-p hidden>${t('badp')}</div><button id=ab class=btn style="margin-top:16px" onclick="doAuth()">${t(r?'signup':'login')}</button><button class="btn g" style="margin-top:8px" onclick="st.reg=!st.reg;render()">${t(r?'haveacc':'noacc')}</button><button class="btn g" style="margin-top:8px;border:0" onclick="st.auth=1;render()">${t('guest')}</button></div>`};
function doAuth(){const r=st.reg;if(!chk([...(r?[['a-n',v('a-n').length>1]]:[]),['a-e',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('a-e'))],['a-p',($('#a-p').value||'').length>=6]]))return;busy('ab');setTimeout(()=>{if(r)me.name=v('a-n');st.auth=1;st.s='home';render()},800)}

function CX(c,k){const m=(c.msgs||[]).map(x=>`<div class=note style="margin:6px 0${x[0]=='me'?'':';background:var(--card);border:1px solid var(--bd)'}"><small class=m>${t(x[0]=='me'?'you':'ofc')}</small><br>${esc(x[1])}</div>`).join('');
return (k>=2?`<div class=note><b>${t('pk')}:</b> WNH-${1000+c.id*37}<br>${t('pkn')}</div>`:'')+`<button class="btn g" style="margin-bottom:8px" onclick="tg(${c.id})">${t('msg')}</button>`+(c.open?`${m}<p class=m>${t('safe')}</p><input id=m-${c.id} aria-label="${t('msg')}" placeholder="${t('mph')}"><button class="btn n" style="margin:6px 0 8px" onclick="sendM(${c.id})">${t('send')}</button>`:'')}
function tg(id){const c=claims.find(x=>x.id==id);c.open=!c.open;render(1)}
function sendM(id){const c=claims.find(x=>x.id==id),r=v('m-'+id);if(!r)return;const x=r.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'***').replace(/\+?\d[\d\s-]{6,}\d/g,'***');if(x!=r)toast(t('maskd'));(c.msgs=c.msgs||[]).push(['me',x]);render(1);setTimeout(()=>{c.msgs.push(['of',t('rep')]);render(1)},1000)}
function prog(){const n=['r-t','r-c','r-l'].filter(i=>v(i)).length;$('#rp').textContent=n+'/3 '+t('done');$('#rpb').style.width=n*33.4+'%'}

function aiScan(src){const b=$('#ai');b.innerHTML=`<b>${t('ai_t')}</b><br>${t('ai_w')}`;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(im,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,bl=0;for(let y=4;y<12;y++)for(let q=4;q<12;q++){const i=(y*16+q)*4;r+=d[i];g+=d[i+1];bl+=d[i+2]}r/=64;g/=64;bl/=64;
const mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);let h=0;if(mx>mn){h=mx==r?((g-bl)/(mx-mn)+6)%6:mx==g?(bl-r)/(mx-mn)+2:(r-g)/(mx-mn)+4;h*=60}
const cl=mx<60?'black':mn>200?'white':mx-mn<28?'gray':h<20||h>=340?'red':h<45?(mx<150?'brown':'orange'):h<70?'yellow':h<170?'green':h<260?'blue':'purple';
const sel=v('r-c'),cat=sel||CATS[(src.length+Math.round(r+g+bl))%8],cf=sel?91:74+(src.length%17);
setTimeout(()=>{const bx=$('#ai');if(!bx)return;st.tmp.ai={cat,cl};const sim=items.filter(i=>i.cat==cat&&i.type!=st.rt&&i.status!='returned');
bx.innerHTML=`<b>${t('ai_t')}</b><br>${t('ai_f')}: <b>${t('cl_'+cl)} - ${t('c_'+cat)}</b><br>${t('ai_c')}: ${t('cl_'+cl)}<br>${t('ai_cf')}: ${cf}%${bar(cf)}<button class="btn n" style="margin:8px 0" onclick="aiApply()">${t('ai_a')}</button><br>${t('ai_m')}: <b>${sim.length}</b>${sim.slice(0,2).map(i=>`<div class=kv><span>${n(i.title)}</span><span>${t('l_'+i.loc)}</span></div>`).join('')}<p class=m>${t('ai_d')}</p>`},1200)};im.src=src}
function aiApply(){const a=st.tmp.ai;if(!a)return;$('#r-c').value=a.cat;if(!v('r-t'))$('#r-t').value=t('cl_'+a.cl)+' - '+t('c_'+a.cat);prog();toast(t('ai_a'))}
setTimeout(()=>{st.load=false;render()},900);render();
</script></body></html>
